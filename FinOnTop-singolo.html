*{box-sizing:border-box}
body{margin:0;font:17px/1.5 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(90deg,var(--navy),var(--brand2));color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .logo{font-weight:800;font-size:22px;color:#fff;text-decoration:none;margin-right:auto}
header select{font-size:15px;padding:6px 8px;border-radius:8px;border:0}
.layout{display:flex;max-width:1200px;margin:0 auto}
nav{width:220px;padding:16px 8px;flex-shrink:0}
nav a{display:block;padding:10px 14px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;margin-bottom:2px}
nav a:hover{background:#e0f2fe}nav a.on{background:var(--brand);color:#fff}
nav small{display:block;color:var(--mut);margin:14px 14px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
main{flex:1;padding:20px 16px;min-width:0}
h1{margin:0 0 4px;font-size:28px}.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0f172a0d}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
a.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:inherit;text-decoration:none;box-shadow:0 2px 8px #0f172a0d}
a.tile:hover{border-color:var(--brand);transform:translateY(-2px)}
.tile .ic{font-size:30px}.tile h3{margin:6px 0 2px}.tile p{margin:0;color:var(--mut);font-size:15px}
.tag{font-size:12px;background:#fef3c7;color:#92400e;border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:middle}
label{display:block;font-weight:600;margin:14px 0 4px}
.row{display:flex;gap:12px;align-items:center}
input,select{font:inherit}
input[type=number],input[type=text],input[type=date],input[type=month],select.f{padding:8px 10px;border:1px solid var(--line);border-radius:10px;width:100%;background:var(--inp);color:var(--ink)}
.row input[type=number]{width:150px;flex-shrink:0;font-size:19px}
input[type=range]{flex:1;height:34px;accent-color:var(--brand)}
.res{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:16px 0}
.res div{background:var(--res);border-radius:12px;padding:12px 14px;color:var(--mut);font-size:14px}
.res b{display:block;font-size:24px;color:var(--brand2)}.res b.bad{color:var(--bad)}.res b.ok{color:var(--ok)}
.answer{background:linear-gradient(135deg,#e0f2fe,#f0fdf4);border-radius:14px;padding:14px 16px;font-size:18px;margin:14px 0}
button,.btn{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer}
button.alt{background:var(--tab);color:var(--ink)}button.del{background:none;color:var(--bad);padding:2px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--tab);color:var(--ink)}.tabs button.on{background:var(--brand);color:#fff}
canvas{width:100%;display:block}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}
.disc{font-size:13px;color:var(--mut);margin-top:20px}
.due{color:var(--bad);font-weight:700}.soon{color:var(--warn);font-weight:700}
@media(max-width:800px){.layout{display:block}nav{width:auto;display:flex;overflow-x:auto;padding:8px}nav a{white-space:nowrap}nav small{display:none}}
@media print{header,nav,button,.noprint{display:none!important}body{background:var(--inp);color:var(--ink)}.card{box-shadow:none;break-inside:avoid}}

[data-theme=dark]{--bg:#0a1220;--card:#111c2e;--ink:#e6edf7;--mut:#8fa3bf;--line:#1f2f48;--inp:#0d1828;--res:#0d1828;--tab:#1b2a42;--brand:#22d3ee;--brand2:#38bdf8;--navy:#050b16;--ok:#22c55e;--bad:#ef4444}
[data-theme=dark] nav a:hover{background:#1b2a42}[data-theme=dark] .answer{background:linear-gradient(135deg,#0d2a3f,#0d2a22)}[data-theme=dark] .tag{background:#3b2f0b;color:#fbbf24}[data-theme=dark] button{color:#04121f}[data-theme=dark] .tabs button:not(.on),[data-theme=dark] button.alt{color:var(--ink)}


/* restyle v2 */
:root{--grad:linear-gradient(135deg,#06b6d4,#10b981);--brand:#0891b2;--brand2:#0e7490}
body{background:radial-gradient(900px 500px at 85% -10%,#06b6d41f,transparent 60%),radial-gradient(700px 400px at -5% 10%,#10b9811a,transparent 60%),var(--bg);background-attachment:fixed}
header{background:linear-gradient(90deg,#050b16,#0b2a3f);border-bottom:2px solid transparent;border-image:var(--grad) 1;box-shadow:0 4px 20px #0006}
header .logo{display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
header .logo .lg{width:34px;height:34px;filter:drop-shadow(0 2px 6px #06b6d466)}
header .logo em{font-style:normal;color:#22d3ee}
header select{background:#ffffff14;color:#fff;border:1px solid #ffffff29}header select option{color:#0f172a}
header button.alt{background:#ffffff14;color:#fff;border:1px solid #ffffff29}
nav a{transition:.15s}nav a.on{background:var(--grad);color:#04121f;box-shadow:0 4px 14px #06b6d44d}
button,.btn{background:var(--grad);color:#04121f;box-shadow:0 2px 8px #06b6d433;transition:.15s}
button:hover{filter:brightness(1.07);transform:translateY(-1px)}
button.alt,.tabs button{background:var(--tab);color:var(--ink);box-shadow:none}
.tabs button.on{background:var(--grad);color:#04121f}
.card,a.tile{transition:.2s}.card:hover,a.tile:hover{box-shadow:0 8px 24px #06b6d41f}
a.tile{border-top:3px solid #06b6d4}a.tile:nth-child(3n+2){border-top-color:#10b981}a.tile:nth-child(3n){border-top-color:#f59e0b}
.tile .ic{display:inline-flex;width:52px;height:52px;align-items:center;justify-content:center;border-radius:14px;background:#06b6d41a}
h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;letter-spacing:-.02em}
.res b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.res b.bad{background:none;color:var(--bad)}.res b.ok{background:none;color:var(--ok)}
.res div{border-left:3px solid #06b6d4}
input[type=range]{accent-color:#10b981}
[data-theme=dark]{--bg:#070d1a;--card:#0f1b2e}
[data-theme=dark] header{background:linear-gradient(90deg,#03070f,#0a2236)}
/* tema chiaro v3: ciano, bordi netti */
:root:not([data-theme=dark]){--bg:#e3f6fb;--card:#fff;--line:#0e7490;--res:#d9f3fa;--inp:#fff;--tab:#cdeef7;--brand:#0891b2;--brand2:#0e7490}
:root:not([data-theme=dark]) body{background:#e3f6fb}
:root:not([data-theme=dark]) header{background:linear-gradient(90deg,#ffffff,#cdeff8);color:#0b2a3f;border-bottom:3px solid #0891b2;box-shadow:none;border-image:none}

@media(max-width:800px){:root:not([data-theme=dark]) nav{margin:8px;box-shadow:none}}
/* layout: parametri a sinistra, grafici in diretta a destra */
.grid2{display:grid;grid-template-columns:minmax(290px,400px) minmax(0,1fr);gap:26px;align-items:start}
.grid2 .out{position:sticky;top:84px;min-width:0}
.grid2 .out .res{margin-top:0}
.after{margin-top:12px}
@media(max-width:900px){.grid2{display:block}.grid2 .out{position:sticky;top:64px;z-index:4;background:var(--card);border-bottom:2px solid var(--brand);margin:-8px -4px 12px;padding:8px 4px 6px}.grid2 .out .res{display:none}.grid2 .out .answer{font-size:15px;margin:6px 0}}
.tick{flex:1 1 200px;max-width:420px;overflow:hidden;white-space:nowrap;font-weight:600;font-size:14px;color:#67e8f9;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tick span{display:inline-block;padding-left:100%;animation:tickmove 16s linear infinite}
.tick:hover span{animation-play-state:paused}
:root:not([data-theme=dark]) .tick{color:#0e7490}
@keyframes tickmove{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tick span{animation:none;padding-left:0}.tick{white-space:normal}}
@media (max-width:700px){.tick{order:5;flex-basis:100%;max-width:none}}

    const X = i => L + i * (w - L - R) / (xs.length - 1), Y = v => T + (hi - v) / (hi - lo) * (h - T - B), z = Y(0);
    const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, cssv('--card')); bg.addColorStop(1, cssv('--bg'));
    c.fillStyle = bg; c.fillRect(0, 0, w, h);
    c.font = '12px system-ui'; c.strokeStyle = cssv('--line'); c.fillStyle = cssv('--mut'); c.lineWidth = 1; c.setLineDash([2, 4]);
    for (let g = 0; g <= 5; g++) { const v = lo + (hi - lo) * g / 5, y = Y(v); c.beginPath(); c.moveTo(L, y); c.lineTo(w - R, y); c.stroke(); c.textAlign = 'right'; c.fillText(num(v, Math.abs(hi - lo) < 20 ? 1 : 0), L - 6, y + 4); }
    c.setLineDash([]); c.textAlign = 'center';
    const st = Math.ceil(xs.length / 8); for (let i = 0; i < xs.length; i += st) c.fillText(opt.xLabel ? opt.xLabel(xs[i]) : xs[i], X(i), h - 9);
    [['#22c55e', v => v >= 0], ['#ef4444', v => v < 0]].forEach(([col, ok]) => {
      c.save(); c.beginPath(); c.rect(L, ok(1) ? T : z, w - L - R, ok(1) ? z - T : h - B - z); c.clip();
      const gr = c.createLinearGradient(0, T, 0, h - B); gr.addColorStop(0, col + (ok(1) ? '66' : '00')); gr.addColorStop(1, col + (ok(1) ? '00' : '66'));
      c.beginPath(); c.moveTo(X(0), z); ys.forEach((v, i) => c.lineTo(X(i), Y(v))); c.lineTo(X(xs.length - 1), z); c.closePath(); c.fillStyle = gr; c.fill();
      c.beginPath(); ys.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v))); c.strokeStyle = col; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke(); c.restore();
    });
    c.strokeStyle = cssv('--mut'); c.lineWidth = 1; c.beginPath(); c.moveTo(L, z); c.lineTo(w - R, z); c.stroke();
    if (opt.mark != null) {
      const mi = xs.reduce((b, x, i) => Math.abs(x - opt.mark) < Math.abs(xs[b] - opt.mark) ? i : b, 0);
      c.strokeStyle = cssv('--brand'); c.setLineDash([5, 4]); c.beginPath(); c.moveTo(X(mi), T); c.lineTo(X(mi), h - B); c.stroke(); c.setLineDash([]);
      c.fillStyle = cssv('--brand'); c.textAlign = 'left'; c.fillText(opt.markLabel || '', Math.min(X(mi) + 5, w - 80), T + 12);
    }
    for (let i = 1; i < ys.length; i++) if (ys[i - 1] < 0 !== ys[i] < 0) {
      const x = xs[i - 1] + (xs[i] - xs[i - 1]) * (0 - ys[i - 1]) / (ys[i] - ys[i - 1]), px = L + ((i - 1) + (0 - ys[i - 1]) / (ys[i] - ys[i - 1])) * (w - L - R) / (xs.length - 1);
      c.fillStyle = '#f59e0b'; c.beginPath(); c.arc(px, z, 5, 0, 7); c.fill(); c.textAlign = 'center'; c.fillText('BE ' + num(x, 1), px, z - 10);
    }
    if (hx != null) {
      const i = Math.max(0, Math.min(xs.length - 1, Math.round((hx - L) / ((w - L - R) / (xs.length - 1)))));
      c.strokeStyle = cssv('--ink'); c.globalAlpha = .4; c.beginPath(); c.moveTo(X(i), T); c.lineTo(X(i), h - B); c.stroke(); c.globalAlpha = 1;
      c.fillStyle = ys[i] >= 0 ? '#22c55e' : '#ef4444'; c.beginPath(); c.arc(X(i), Y(ys[i]), 5, 0, 7); c.fill();
      const txt = (opt.xLabel ? opt.xLabel(xs[i]) : num(xs[i], 1)) + '  →  ' + fmt(ys[i]), tw = c.measureText(txt).width + 16, tx = Math.min(Math.max(X(i) - tw / 2, L), w - R - tw);
      c.fillStyle = cssv('--navy'); c.fillRect(tx, T + 20, tw, 24); c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(txt, tx + 8, T + 36);
    }
  };
  canvas.onmousemove = e => draw(e.clientX - canvas.getBoundingClientRect().left);
  canvas.onmouseleave = () => draw();
  draw();
}

</script><script>const CATS = {
  casa: ['c_casa', 'c_utenze', 'c_spesa', 'c_auto', 'c_salute', 'c_svago', 'c_altro'],

const head = (k, d) => `<h1>${t(k)}</h1><p class="sub">${t(d)}</p>`;
const tabs = (items, cur) => `<div class="tabs noprint">${items.map(([id, k]) => `<button data-tab="${id}" class="${id === cur ? 'on' : ''}">${t(k)}</button>`).join('')}</div>`;
const monthOf = d => d.slice(0, 7);

function daysUntil(x) {
  const today = todayISO(), nx = Core.nextOccurrence(x.date, x.rep, today);
  return { date: nx, days: Math.round((nx - new Date(today + 'T00:00:00')) / 86400000) };
}
const dueLabel = n => n < 0 ? `<span class="due">${n} ${t('days_left')}</span>` : n === 0 ? `<span class="due">${t('today')}</span>` : n <= 7 ? `<span class="soon">${n} ${t('days_left')}</span>` : `${n} ${t('days_left')}`;

const addMonthsISO = (iso, i) => {
  const [y, m, d] = iso.split('-').map(Number), dim = new Date(y, m + i, 0).getDate(), dt = new Date(y, m - 1 + i, Math.min(d, dim));
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
};
const VCATS = ['v_ins', 'v_tax', 'v_maint', 'v_tires', 'v_toll', 'v_fine', 'v_vother'];
const Veh = {
  list: () => Array.isArray(State.get().veh) ? State.get().veh : [],
  costs: () => Array.isArray(State.get().vcost) ? State.get().vcost : [],
  paidN(v) { const today = todayISO(); let n = 0; while (n < v.months && addMonthsISO(v.start, n) <= today) n++; return n; },
  virtual() {
    const out = [], today = todayISO(), vs = Veh.list();
    vs.forEach(v => {
      if (v.down > 0 && v.start <= today) out.push({ id: 'vd' + v.id, desc: v.name + ' · ' + t('v_down'), amt: v.down, cat: 'c_auto', date: v.start });
      if (v.fee > 0) for (let i = 0, n = Veh.paidN(v); i < n; i++) out.push({ id: 'vr' + v.id + i, desc: v.name, amt: v.fee, cat: 'c_auto', date: addMonthsISO(v.start, i) });
    });
    Veh.costs().forEach(c => { const v = vs.find(x => x.id === c.vid); out.push({ id: 'vc' + c.id, desc: (v ? v.name + ' · ' : '') + (c.desc || t(c.cat)), amt: c.amt, cat: 'c_auto', date: c.date }); });
    return out;
  },
  stats(v) {
    const today = todayISO(), n = Veh.paidN(v), ex = Veh.costs().filter(c => c.vid === v.id), exTot = ex.reduce((a, c) => a + c.amt, 0);
    const rates = v.fee * n + (v.start <= today ? v.down : 0), total = rates + exTot, [sy, sm] = v.start.split('-').map(Number), [ty, tm] = today.split('-').map(Number);
    const el = v.start <= today ? Math.max(1, (ty - sy) * 12 + tm - sm + 1) : 0, left = Math.max(0, v.months - n), contract = v.down + v.fee * v.months;
    return { n, left, leftAmt: left * v.fee, exTot, total, avg: el ? total / el : 0, contract, end: v.months > 0 ? addMonthsISO(v.start, v.months - 1) : '', ex };
  }
};

        if (f.size > 1e6) { $('pmsg').textContent = t('csv_err'); return; }
        const r = new FileReader();
        r.onload = () => {
          const lines = String(r.result).replace(/^\ufeff/, '').split(/\r?\n/).filter(x => x.trim());
          const dl = [';', '\t', ','].reduce((b, d) => (lines[0] || '').split(d).length > (lines[0] || '').split(b).length ? d : b, ';');
          const cut = x => x.split(dl).map(c => c.trim().replace(/^"|"$/g, ''));
          const hd = cut(lines[0] || '').map(h => h.toLowerCase());
          const iT = find(hd, ['symbol', 'ticker', 'simbolo', 'isin', 'titolo', 'strumento', 'instrument', 'security', 'name', 'descrizione', 'nome']);
          const iQ = find(hd, ['quant', 'qty', 'shares', 'pezzi', 'unit']);
          const iC = find(hd, ['medio', 'carico', 'avg', 'average', 'cost', 'acquisto', 'price', 'prezzo']);
          let iL = find(hd, ['last', 'ultimo', 'current', 'corrente', 'mercato', 'market', 'close', 'chiusura']);
          if (iL === iC) iL = -1;
          if (iT < 0 || iQ < 0 || iC < 0) { $('pmsg').textContent = t('csv_err'); return; }
          let n = 0;
          lines.slice(1, 501).forEach(ln => {
            const c = cut(ln), q = toNum(c[iQ]), p = toNum(c[iC]), l = iL >= 0 ? toNum(c[iL]) : NaN, tk = (c[iT] || '').slice(0, 20);
            if (tk && q > 0 && p >= 0) { s.port.push({ id: uid(), t: tk, q, c: p, l: l >= 0 ? l : p }); n++; }
          });
          State.save(); $('pmsg').textContent = n ? t('csv_done', { n }) : t('csv_err'); draw();
        };
        r.readAsText(f); e.target.value = '';
      };
      $('pcsv').onclick = () => download('portafoglio.csv', toCSV([[t('ticker'), t('qty'), t('avg_cost'), t('last_price'), t('value')]].concat(s.port.map(x => [x.t, x.q, x.c, x.l, x.q * x.l]))), 'text/csv');
      draw();
    }
  },

    if (!auth) return null;
    if (auth.exp - 60000 > Date.now()) return auth.at;
    try { setAuth(fromSession(await api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: auth.rt }) }), auth)); return auth.at; }
    catch (e) { setAuth(null); return null; }
  };
  const payload = () => { const o = {}; Object.keys(State.get()).forEach(k => { if (!EX.includes(k)) o[k] = State.get()[k]; }); return o; };
  const push = async () => {
    const tok = await token(); if (!tok) return;
    const at = new Date().toISOString();
    await api('/rest/v1/user_data?on_conflict=user_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: auth.id, data: payload(), updated_at: at }) }, tok);
    auth.cloudAt = at; localStorage.setItem(AK, JSON.stringify(auth));
  };
  const pull = async () => { const tok = await token(); if (!tok) return null; const r = await api('/rest/v1/user_data?select=data,updated_at', {}, tok); return r && r[0] || null; };
  const apply = row => { Object.assign(State.get(), row.data); origSave(); auth.cloudAt = row.updated_at; localStorage.setItem(AK, JSON.stringify(auth)); route(); };
  const sync = async () => {
    if (!auth || busy) return; busy = true;
    try {
      const row = await pull();
      if (!row) await push();
      else if (auth.cloudAt === undefined) {
        const has = DATA.some(k => (State.get()[k] || []).length);
        if (!has || confirm(t('acc_conflict'))) apply(row); else await push();
      } else if (row.updated_at > auth.cloudAt) apply(row);
    } finally { busy = false; }
  };
  const origSave = State.save;
  State.save = () => { origSave(); if (auth) { clearTimeout(timer); timer = setTimeout(() => push().catch(() => { }), 1500); } };

  const ui = () => { const b = $('hu'); if (b) b.textContent = '👤 ' + (auth ? auth.email.split('@')[0] : t('acc_login')); };
  const open = () => {
    let d = $('accd'); if (!d) { document.body.insertAdjacentHTML('beforeend', '<dialog id="accd"></dialog>'); d = $('accd'); }
    const msg = (m, bad) => { $('accm').textContent = m; $('accm').className = 'sub' + (bad ? ' bad' : ''); };
    const close = `<button type="button" class="alt" id="accx">${t('acc_close')}</button>`;
    if (auth) {
      d.innerHTML = `<h3>${t('acc_title')}</h3><p><b>${esc(auth.email)}</b></p><p class="sub">${t('acc_info')}</p><p class="sub" id="accm"></p><div class="row"><button id="accs">${t('acc_sync')}</button><button class="alt" id="acco">${t('acc_logout')}</button>${close}</div>`;
      $('accs').onclick = async () => { try { await sync(); await push(); msg(t('acc_synced')); } catch (e) { msg(e.message, 1); } };
      $('acco').onclick = () => { setAuth(null); d.close(); };
    } else {
      d.innerHTML = `<h3>${t('acc_title')}</h3><label>${t('acc_email')}</label><input type="email" id="acce" autocomplete="email"><label>${t('acc_pass')}</label><input type="password" id="accp" autocomplete="current-password"><p class="sub" id="accm"></p><div class="row"><button id="accl">${t('acc_login')}</button><button class="alt" id="accr">${t('acc_signup')}</button>${close}</div><p class="sub"><a href="#" id="accf">${t('acc_forgot')}</a></p><p class="sub">${t('acc_info')}</p>`;
      const cred = () => { const e = $('acce').value.trim(), p = $('accp').value; if (!e || !p) { msg(t('acc_need'), 1); return null; } return { email: e, password: p }; };
      const done = async j => { setAuth(fromSession(j)); await sync(); d.close(); };
      $('accl').onclick = async () => { const c = cred(); if (!c) return; try { await done(await api('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify(c) })); } catch (e) { msg(e.message, 1); } };
      $('accr').onclick = async () => { const c = cred(); if (!c) return; try { const j = await api('/auth/v1/signup', { method: 'POST', body: JSON.stringify(c) }); if (j.access_token) await done(j); else msg(t('acc_conf')); } catch (e) { msg(e.message, 1); } };
      $('accf').onclick = async e => { e.preventDefault(); const em = $('acce').value.trim(); if (!em) { msg(t('acc_need'), 1); return; } try { await api('/auth/v1/recover', { method: 'POST', body: JSON.stringify({ email: em }) }); msg(t('acc_reset')); } catch (x) { msg(x.message, 1); } };
    }
    $('accx').onclick = () => d.close();
    d.showModal();
  };

  const fromHash = async () => {
    const h = location.hash;
    if (!h.includes('access_token=')) return;
    const p = new URLSearchParams(h.replace(/^#\/?/, ''));
    history.replaceState(null, '', location.pathname + '#/home');
    try {
      const u = await api('/auth/v1/user', {}, p.get('access_token'));
      setAuth({ at: p.get('access_token'), rt: p.get('refresh_token'), exp: Date.now() + (+p.get('expires_in') || 3600) * 1000, id: u.id, email: u.email });
      if (p.get('type') === 'recovery') { const np = prompt(t('acc_newpw')); if (np && np.length >= 8) await api('/auth/v1/user', { method: 'PUT', body: JSON.stringify({ password: np }) }, auth.at); }
      await sync();
    } catch (e) { }
  };

  const init = () => {
    $('ht').insertAdjacentHTML('beforebegin', '<button id="hu" class="alt" aria-label="Account"></button>');
    $('hu').onclick = open; ui();
    fromHash().then(() => { if (auth) sync().catch(() => { }); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && auth) sync().catch(() => { }); });
  };
  return { init, ui };
})();

<script>
const ORDER = [['grp_base', ['home', 'spese', 'scadenze', 'veicoli', 'patrimonio', 'report']], ['grp_calc', ['prestiti', 'risparmio']], ['grp_adv', ['invest', 'portafoglio']]];
const CURS = ['EUR', 'USD', 'GBP', 'CHF', 'JPY', 'CAD', 'AUD', 'BRL', 'SEK', 'PLN'];

function checkAlerts() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const s = State.get(), today = todayISO();
  s.deadlines.forEach(x => {
    const d = daysUntil(x);
    if (d.days >= 0 && d.days <= x.alert && s.notified[x.id] !== today) {
      new Notification(APP_NAME + ' · ' + x.title, { body: Core.iso(d.date) + (x.amt ? ' · ' + fmt(x.amt) : '') });
      s.notified[x.id] = today; State.save();
    }
  });
}

const SAVABLE = ['prestiti', 'risparmio', 'invest'];
let pendingScen = null, barObs = null;

function applyScen(sc) {
  const main = $('main');
  if (sc.tab) { const b = main.querySelector('[data-tab="' + sc.tab + '"]'); if (b && !b.classList.contains('on')) b.click(); }
  const els = [...main.querySelectorAll('select[id],input[type=number][id]')];
  [...els.filter(e => e.tagName === 'SELECT'), ...els.filter(e => e.tagName !== 'SELECT')].forEach(e => {
    if (!(e.id in sc.vals)) return;
    e.value = sc.vals[e.id]; e.dispatchEvent(new Event(e.tagName === 'SELECT' ? 'change' : 'input'));
  });
  if (sc.ty) { const b = main.querySelector('[data-ty="' + sc.ty + '"]'); if (b) b.click(); }
}

function saveScen(mod) {
  const main = $('main'), name = $('scn').value.trim().slice(0, 60);
  if (!name) { $('scn').focus(); return; }
  const vals = {};
  main.querySelectorAll('select[id],input[type=number][id]').forEach(e => { vals[e.id] = e.value; });
  const tb = main.querySelector('[data-tab].on'), ty = main.querySelector('[data-ty].on');
  const s = State.get(); (s.scen = s.scen || []).push({ id: uid(), name, mod, tab: tb ? tb.dataset.tab : '', ty: ty ? ty.dataset.ty : '', vals });
  State.save(); $('scm').textContent = t('sc_saved'); $('scn').value = ''; renderNav(mod);
}

function renderNav(cur) {
  const sc = State.get().scen || [];
  $('nav').innerHTML = ORDER.map(([g, ids]) => `<small>${t(g)}</small>` + ids.map(i => `<a href="#/${i}" class="${i === cur ? 'on' : ''}">${Plan.can(i) ? Modules[i].icon : '🔒'} ${t(i)}${Plan.need(i) !== 'free' ? '<span class="tag">' + Plan.label(Plan.need(i)) + '</span>' : ''}</a>`).join('')).join('') +
    `<small>💾 ${t('sc_title')}</small>` + (sc.length ? sc.map(x => `<a href="#/${x.mod}" data-sc="${x.id}" class="sc">${esc(x.name)} <button class="alt scx" data-del="${x.id}" aria-label="${esc(t('sc_del'))}">✕</button></a>`).join('') : `<span class="scemp">${t('sc_empty')}</span>`);
  $('nav').querySelectorAll('[data-sc]').forEach(a => a.onclick = e => {
    e.preventDefault();
    if (e.target.dataset.del) { const s = State.get(); s.scen = s.scen.filter(x => x.id !== e.target.dataset.del); State.save(); renderNav(cur); return; }
    pendingScen = sc.find(x => x.id === a.dataset.sc);
    if (location.hash === '#/' + pendingScen.mod) route(); else location.hash = '#/' + pendingScen.mod;
  });
}

function route() {
  const id = (location.hash.replace('#/', '') || 'home');
  const m = Modules[id] || Modules.home, cur = Modules[id] ? id : 'home';
  renderNav(cur); Cloud.ui();
  $('tk').textContent = t('tagline');

  if (!Plan.can(cur)) { main.innerHTML = Plan.lockedView(cur) + `<p class="disc">${t('disc')}</p>`; return; }

  const addBar = () => {
    if (!SAVABLE.includes(cur) || $('scn')) return;
    main.insertAdjacentHTML('beforeend', `<div class="card noprint" id="scbar"><b>💾 ${t('sc_save')}</b><div class="row"><input type="text" id="scn" maxlength="60" placeholder="${esc(t('sc_name'))}"><button id="scb">${t('sc_save')}</button></div><p class="sub" id="scm"></p></div>`);

  };

}
