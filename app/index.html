<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinOnTop</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%271%27 x2=%271%27 y2=%270%27%3E%3Cstop offset=%270%27 stop-color=%27%2306b6d4%27/%3E%3Cstop offset=%271%27 stop-color=%27%2310b981%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 22l6-7 5 4 7-9M20 10h5v5%27 stroke=%27%23041421%27 stroke-width=%273%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E"><meta name="theme-color" content="#050b16"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FinOnTop"><link rel="stylesheet" href="../assets/app.css?v=20261022b"></head><body>
<header><a class="logo" href="#/home" id="logo"></a><div class="tick" aria-label="slogan"><span id="tk"></span></div>
<select id="hp" aria-label="Profilo"></select><button id="hj" class="alt">🔗</button><select id="hl" aria-label="Lingua"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="pl">Polski</option><option value="sv">Svenska</option><option value="nl">Nederlands</option><option value="fi">Suomi</option><option value="fr">Français</option><option value="pt">Português</option><option value="da">Dansk</option><option value="cs">Čeština</option><option value="ro">Română</option><option value="el">Ελληνικά</option><option value="hu">Magyar</option></select>
<select id="hc" aria-label="Valuta"></select><button id="hh" class="alt">👁</button><button id="ht" class="alt" aria-label="Tema">🌓</button></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<p style="text-align:center;font-size:12px;margin:16px"><a href="../legal.html">Privacy &amp; Termini / Terms</a></p>
<script src="../assets/config.js?v=20261022b"></script><script src="../assets/i18n.js?v=20261022b"></script><script src="../assets/i18n_es_de.js?v=20261022b"></script><script src="../assets/i18n_more.js?v=20261022b"></script><script src="../assets/i18n_more2.js?v=20261022b"></script><script src="../assets/i18n_pac.js?v=20261022b"></script><script src="../assets/i18n_port.js?v=20261022b"></script><script src="../assets/i18n_rep.js?v=20261022b"></script><script src="../assets/i18n_opt.js?v=20261022b"></script><script src="../assets/i18n_veh.js?v=20261022b"></script><script src="../assets/i18n_pay.js?v=20261023a"></script><script src="../assets/i18n_biz.js?v=20261023b"></script><script src="../assets/i18n_fleet.js?v=20261023c"></script><script src="../assets/i18n_ntf.js?v=20261023d"></script><script src="../assets/i18n_help.js?v=20261023f"></script><script src="../assets/core.js?v=20261022b"></script><script src="../assets/ui.js?v=f20261022b"></script><script src="../assets/modules.js?v=e20261022b"></script><script src="../assets/business.js?v=20261023e"></script><script src="../assets/cloud.js?v=f20261022b"></script><script src="../assets/plans.js?v=20261022c"></script>
<script>
const ORDER = [['grp_base', ['home', 'spese', 'scadenze', 'veicoli', 'patrimonio', 'report']], ['grp_calc', ['prestiti', 'risparmio']], ['grp_adv', ['invest', 'portafoglio']], ['grp_biz', ['cassa', 'fido', 'pareggio', 'flotta']]];
const CURS = ['EUR', 'USD', 'GBP', 'CHF', 'JPY', 'CAD', 'AUD', 'BRL', 'SEK', 'PLN'];

function checkAlerts() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const s = State.get(), today = todayISO();
  s.deadlines.forEach(x => {
    const d = daysUntil(x);
    if (d.days >= 0 && d.days <= x.alert && s.notified[x.id] !== today) {
      new Notification(APP_NAME + ' · ' + x.title, { body: Core.iso(d.date) + (x.amt ? ' · ' + fmt(x.amt) : '') });
      s.notified[x.id] = today; State.save();
    }
  });
  const n = new Date();
  if (n.getHours() >= 22 && s.notified.eve !== today) { new Notification(APP_NAME, { body: t('ntf_eve') }); s.notified.eve = today; State.save(); }
  (Array.isArray(s.veh) ? s.veh : []).forEach(v => ['ins', 'tax', 'rev', 'svc'].forEach(k => {
    if (!v[k]) return; const key = 'f' + v.id + k, dd = Math.round((new Date(v[k] + 'T00:00:00') - new Date(today + 'T00:00:00')) / 864e5);
    if (dd <= 30 && s.notified[key] !== today) { new Notification(APP_NAME + ' · ' + v.name, { body: t('fl_' + k) + ' · ' + v[k] }); s.notified[key] = today; State.save(); }
  }));
}

const SAVABLE = ['prestiti', 'risparmio', 'invest'];
let pendingScen = null, barObs = null;

function applyScen(sc) {
  const main = $('main');
  if (sc.tab) { const b = main.querySelector('[data-tab="' + sc.tab + '"]'); if (b && !b.classList.contains('on')) b.click(); }
  const els = [...main.querySelectorAll('select[id],input[type=number][id]')];
  [...els.filter(e => e.tagName === 'SELECT'), ...els.filter(e => e.tagName !== 'SELECT')].forEach(e => {
    if (!(e.id in sc.vals)) return;
    e.value = sc.vals[e.id]; e.dispatchEvent(new Event(e.tagName === 'SELECT' ? 'change' : 'input'));
  });
  if (sc.ty) { const b = main.querySelector('[data-ty="' + sc.ty + '"]'); if (b) b.click(); }
}

function saveScen(mod) {
  const main = $('main'), name = $('scn').value.trim().slice(0, 60);
  if (!name) { $('scn').focus(); return; }
  const vals = {};
  main.querySelectorAll('select[id],input[type=number][id]').forEach(e => { vals[e.id] = e.value; });
  const tb = main.querySelector('[data-tab].on'), ty = main.querySelector('[data-ty].on');
  const s = State.get(); (s.scen = s.scen || []).push({ id: uid(), name, mod, tab: tb ? tb.dataset.tab : '', ty: ty ? ty.dataset.ty : '', vals });
  State.save(); $('scm').textContent = t('sc_saved'); $('scn').value = ''; renderNav(mod);
}

function renderNav(cur) {
  const sc = State.get().scen || [];
  $('nav').innerHTML = ORDER.map(([g, ids]) => `<small>${t(g)}</small>` + ids.map(i => `<a href="#/${i}" class="${i === cur ? 'on' : ''}">${Plan.can(i) ? Modules[i].icon : '🔒'} ${t(i)}${Plan.need(i) !== 'free' ? '<span class="tag">' + Plan.label(Plan.need(i)) + '</span>' : ''}</a>`).join('')).join('') +
    `<small>💾 ${t('sc_title')}</small>` + (sc.length ? sc.map(x => `<a href="#/${x.mod}" data-sc="${x.id}" class="sc">${esc(x.name)} <button class="alt scx" data-del="${x.id}" aria-label="${esc(t('sc_del'))}">✕</button></a>`).join('') : `<span class="scemp">${t('sc_empty')}</span>`);
  $('nav').querySelectorAll('[data-sc]').forEach(a => a.onclick = e => {
    e.preventDefault();
    if (e.target.dataset.del) { const s = State.get(); s.scen = s.scen.filter(x => x.id !== e.target.dataset.del); State.save(); renderNav(cur); return; }
    pendingScen = sc.find(x => x.id === a.dataset.sc);
    if (location.hash === '#/' + pendingScen.mod) route(); else location.hash = '#/' + pendingScen.mod;
  });
}

function route() {
  const id = (location.hash.replace('#/', '') || 'home');
  const m = Modules[id] || Modules.home, cur = Modules[id] ? id : 'home';
  renderNav(cur); Cloud.ui();
  $('tk').textContent = t('tagline');
  const main = $('main');
  if (!Plan.can(cur)) { main.innerHTML = Plan.lockedView(cur) + `<p class="disc">${t('disc')}</p>`; return; }
  m.render(main);
  const addBar = () => {
    if (!SAVABLE.includes(cur) || $('scn')) return;
    main.insertAdjacentHTML('beforeend', `<div class="card noprint" id="scbar"><b>💾 ${t('sc_save')}</b><div class="row"><input type="text" id="scn" maxlength="60" placeholder="${esc(t('sc_name'))}"><button id="scb">${t('sc_save')}</button></div><p class="sub" id="scm"></p></div>`);
    $('scb').onclick = () => saveScen(cur);
  };
  if (barObs) barObs.disconnect();
  barObs = new MutationObserver(addBar); barObs.observe(main, { childList: true });
  addBar();
  if (!main.querySelector('.disc')) main.insertAdjacentHTML('beforeend', `<p class="disc">${t('disc')}</p>`);
  if (pendingScen && pendingScen.mod === cur) { const sc = pendingScen; pendingScen = null; applyScen(sc); }
}

$('logo').innerHTML = '<svg class="lg" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lgg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lgg)"/><path d="M7 22l6-7 5 4 7-9M20 10h5v5" stroke="#041421" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>' + APP_NAME.replace(/^(Fin)(On)(Top)$/, '$1<em>$2</em>$3') + '</span>';
$('hc').innerHTML = CURS.map(c => `<option>${c}</option>`).join('');
document.documentElement.dataset.theme = State.get().theme;
const applyHide = () => { const h = !!State.get().hide; document.documentElement.classList.toggle('hid', h); $('hh').textContent = h ? '🙈' : '👁'; $('hh').title = $('hh').ariaLabel = t('hide_n'); };
$('hh').onclick = () => { const s = State.get(); s.hide = !s.hide; State.save(); applyHide(); };
$('ht').onclick = () => { const s = State.get(); s.theme = s.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = s.theme; State.save(); route(); };
$('hl').value = State.get().lang; $('hc').value = State.get().cur;
const fillP = () => { $('hp').innerHTML = ['casa', 'attivita', 'inv'].map(p => `<option value="${p}" ${State.get().profile === p ? 'selected' : ''}>${t('p_' + p)}</option>`).join(''); };
$('hp').onchange = e => { State.prof.set(e.target.value); route(); };
const fillU = () => { const a = !!State.get().all; $('hj').style.outline = a ? '2px solid #10b981' : ''; $('hj').title = $('hj').ariaLabel = t('all_tog'); };
$('hj').onclick = () => { State.prof.all(!State.get().all); fillU(); route(); };
$('hl').onchange = e => { State.get().lang = e.target.value; document.documentElement.lang = e.target.value; State.save(); fillP(); fillU(); route(); };
$('hc').onchange = e => { State.get().cur = e.target.value; State.save(); route(); };
document.documentElement.lang = State.get().lang;
addEventListener('hashchange', route);
Cloud.init(); applyHide(); fillP(); fillU(); route(); checkAlerts(); setInterval(checkAlerts, 3600000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
</script></body></html>
