<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>smoke</title></head><body>
<div id="main"></div><pre id="out">...</pre>
<script src="assets/config.js"></script><script src="assets/i18n.js"></script><script src="assets/i18n_es_de.js"></script><script src="assets/i18n_more.js"></script><script src="assets/i18n_more2.js"></script><script src="assets/i18n_pac.js"></script><script src="assets/i18n_port.js"></script><script src="assets/i18n_rep.js"></script><script src="assets/i18n_opt.js"></script><script src="assets/i18n_veh.js"></script><script src="assets/i18n_pay.js?v=20261023a"></script><script src="assets/i18n_biz.js?v=20261023b"></script><script src="assets/i18n_fleet.js?v=20261023c"></script><script src="assets/i18n_ntf.js?v=20261023j"></script><script src="assets/i18n_help.js?v=20261023f"></script><script src="assets/plans.js"></script><script src="assets/core.js"></script><script src="assets/ui.js"></script><script src="assets/modules.js"></script><script src="assets/business.js?v=20261023j"></script><script src="assets/futures.js?v=20261023g"></script>
<script>
const log = []; window.onerror = (m, s, l) => log.push('ERRORE ' + m + ' @' + l);
function checkAlerts() {}
const main = document.getElementById('main'), s = State.get();
function click(id) { document.getElementById(id).click(); }
function set(id, v) { const e = document.getElementById(id); e.value = v; e.dispatchEvent(new Event('input')); }
for (const lang of ['it', 'en', 'es', 'de', 'pl', 'sv', 'nl', 'fi', 'fr', 'pt', 'da', 'cs', 'ro', 'el', 'hu']) {
  s.lang = lang;
  for (const id of Object.keys(Modules)) {
    try {
      Modules[id].render(main);
      if (id === 'spese') { set('xa', '50'); set('xd', 'Bolletta <b>x</b>'); click('xadd'); set('xa', '30'); click('xadd'); }
      if (id === 'scadenze') { set('sd', 'IMU'); document.getElementById('st').value = Core.iso(new Date()); click('sadd'); }
      if (id === 'patrimonio') { set('an', 'Casa'); set('av', '200000'); click('aadd'); set('an', 'Mutuo'); set('av', '50000'); document.getElementById('ak').value = 'debt'; click('aadd'); }
      if (id === 'prestiti') { document.getElementById('lt').value = 'l_auto'; document.getElementById('lt').dispatchEvent(new Event('change')); }
      if (id === 'risparmio' || id === 'invest') {
        const tabsList = [...main.querySelectorAll('[data-tab]')].map(b => b.dataset.tab);
        for (const tb of tabsList) { Modules[id].render(main, tb); if (tb === 'option') click('op'); }
      }
      const txt = main.textContent;
      if (/undefined|NaN|Infinity/.test(txt)) log.push('VALORE ANOMALO in ' + id + '/' + lang);
      if (!main.querySelector('h1')) log.push('manca h1 ' + id);
      // chiavi tradotte mancanti
      const miss = [...main.innerHTML.matchAll(/>(c_[a-z]+|d_[a-z]+)</g)]; if (miss.length) log.push('chiave non tradotta ' + id);
    } catch (e) { log.push('ECCEZIONE ' + id + '/' + lang + ': ' + e.message); }
  }
}
for (const l of ['en','es','de','pl','sv','nl','fi','fr','pt','da','cs','ro','el','hu']) { const miss = Object.keys(I18N.it).filter(k => !(k in I18N[l])); log.push('chiavi mancanti ' + l + ': ' + miss.join(',')); }
log.push('spese salvate: ' + s.expenses.length + ', scadenze: ' + s.deadlines.length + ', patrimonio: ' + s.assets.length);
Modules.spese.render(main);
log.push('XSS escape: ' + (s.expenses[0].desc.includes('<b>') && !main.innerHTML.includes('<b>x</b>') && main.innerHTML.includes('&lt;b&gt;') ? 'OK' : 'FAIL'));
localStorage.clear();
document.getElementById('out').textContent = log.join('\n') + '\nFINE';
</script></body></html>
