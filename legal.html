it:{wn:'BOZZA provvisoria: i campi tra [parentesi] vanno compilati e il testo va sostituito/rivisto prima della vendita.',h:`
<h1>Privacy Policy</h1>

<p><b>Dati inseriti nell'app</b> (spese, scadenze, patrimonio, veicoli, scenari): restano nel tuo browser (localStorage). Se crei un account, vengono copiati sul cloud per la sincronizzazione tra dispositivi.</p>

<p>Erogare il servizio e l'account (esecuzione del contratto, art. 6.1.b GDPR); sicurezza e assistenza (legittimo interesse, art. 6.1.f).</p>

<p>I dati dell'account restano finché l'account è attivo; alla cancellazione vengono rimossi.</p>
<h2>I tuoi diritti</h2>
<p>Accesso, rettifica, cancellazione, limitazione, portabilità, opposizione, reclamo al Garante Privacy (garanteprivacy.it). Scrivi a [EMAIL DI CONTATTO].</p>
<h1>Termini d'uso</h1>
<p>FinOnTop offre strumenti di calcolo e simulazione a scopo <b>informativo</b>. I risultati sono stime basate sui dati inseriti e <b>non costituiscono consulenza finanziaria, fiscale, legale o di investimento</b>. Gli investimenti comportano rischi, anche di perdita del capitale. L'utente è responsabile delle proprie decisioni.</p>
<p>Il servizio è fornito "così com'è", senza garanzie di assenza di errori o interruzioni. Nei limiti di legge, il titolare non risponde di danni derivanti dall'uso dei risultati.</p>
