<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinOnTop</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%271%27 x2=%271%27 y2=%270%27%3E%3Cstop offset=%270%27 stop-color=%27%2306b6d4%27/%3E%3Cstop offset=%271%27 stop-color=%27%2310b981%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 22l6-7 5 4 7-9M20 10h5v5%27 stroke=%27%23041421%27 stroke-width=%273%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E"><meta name="theme-color" content="#050b16"><link rel="stylesheet" href="assets/app.css"></head><body>
<header><a class="logo" href="#/home" id="logo"></a>
<select id="hl" aria-label="Lingua"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="pl">Polski</option><option value="sv">Svenska</option><option value="nl">Nederlands</option><option value="fi">Suomi</option></select>
<select id="hc" aria-label="Valuta"></select><button id="ht" class="alt" aria-label="Tema">🌓</button></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<script src="assets/config.js"></script><script src="assets/i18n.js"></script><script src="assets/i18n_es_de.js"></script><script src="assets/i18n_more.js"></script><script src="assets/core.js"></script><script src="assets/ui.js"></script><script src="assets/modules.js"></script>
<script>
const ORDER = [['grp_base', ['home', 'spese', 'scadenze', 'patrimonio']], ['grp_calc', ['prestiti', 'risparmio']], ['grp_adv', ['invest']]];
const CURS = ['EUR', 'USD', 'GBP', 'CHF', 'JPY', 'CAD', 'AUD', 'BRL', 'SEK', 'PLN'];

function checkAlerts() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const s = State.get(), today = todayISO();
  s.deadlines.forEach(x => {
    const d = daysUntil(x);
    if (d.days >= 0 && d.days <= x.alert && s.notified[x.id] !== today) {
      new Notification(APP_NAME + ' · ' + x.title, { body: Core.iso(d.date) + (x.amt ? ' · ' + fmt(x.amt) : '') });
      s.notified[x.id] = today; State.save();
    }
  });
}

function route() {
  const id = (location.hash.replace('#/', '') || 'home');
  const m = Modules[id] || Modules.home, cur = Modules[id] ? id : 'home';
  $('nav').innerHTML = ORDER.map(([g, ids]) => `<small>${t(g)}</small>` + ids.map(i => `<a href="#/${i}" class="${i === cur ? 'on' : ''}">${Modules[i].icon} ${t(i)}${Modules[i].adv ? '<span class="tag">Pro</span>' : ''}</a>`).join('')).join('');
  const main = $('main'); m.render(main);
  if (!main.querySelector('.disc')) main.insertAdjacentHTML('beforeend', `<p class="disc">${t('disc')}</p>`);
}

$('logo').innerHTML = '<svg class="lg" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lgg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lgg)"/><path d="M7 22l6-7 5 4 7-9M20 10h5v5" stroke="#041421" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>' + APP_NAME.replace(/^(Fin)(On)(Top)$/, '$1<em>$2</em>$3') + '</span>';
$('hc').innerHTML = CURS.map(c => `<option>${c}</option>`).join('');
document.documentElement.dataset.theme = State.get().theme;
$('ht').onclick = () => { const s = State.get(); s.theme = s.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = s.theme; State.save(); route(); };
$('hl').value = State.get().lang; $('hc').value = State.get().cur;
$('hl').onchange = e => { State.get().lang = e.target.value; document.documentElement.lang = e.target.value; State.save(); route(); };
$('hc').onchange = e => { State.get().cur = e.target.value; State.save(); route(); };
document.documentElement.lang = State.get().lang;
addEventListener('hashchange', route);
route(); checkAlerts(); setInterval(checkAlerts, 3600000);
</script></body></html>
