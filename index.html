function setLang(l){lang=l;$('lg').value=l;document.documentElement.lang=l;const d=D[l];

function calc(){const m=+$('r1').value,y=+$('r2').value,r=+$('r3').value/100/12;const c0=+$('r4').value;let c=c0,tot=c0;const b=[];
for(let i=1;i<=y*12;i++){c=(c+m)*(1+r);tot+=m;if(i%12===0)b.push([c,tot])}

['r1','r2','r3','r4'].forEach(i=>$(i).oninput=calc);
